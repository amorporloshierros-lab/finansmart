<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile optimizado — evita zoom en inputs iOS/Android -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- PWA / "Agregar a pantalla de inicio" -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinanSmart" />
    <meta name="application-name" content="FinanSmart" />

    <!-- Color de barra del navegador -->
    <meta name="theme-color" content="#0a0e1a" />

    <title>FinanSmart 💸</title>

    <!-- Favicon emoji -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>💸</text></svg>" />

    <style>
      /* Reset base para móvil */
      *, *::before, *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        margin: 0;
        padding: 0;
        background: #0a0e1a;
        overflow-x: hidden;
        /* Evita bounce scroll en iOS */
        overscroll-behavior: none;
      }

      /* Inter desde Google Fonts */
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      /* Botones y inputs heredan fuente */
      input, select, button, textarea {
        font-family: inherit;
      }

      /* Evita que Safari estilice inputs */
      input[type="number"],
      input[type="text"],
      input[type="date"] {
        -webkit-appearance: none;
        appearance: none;
      }

      /* Scroll suave en iOS */
      #root {
        -webkit-overflow-scrolling: touch;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
